<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Autentificare Discord...</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f3f7ff; }
  .box { background: #fff; border-radius: 24px; padding: 2.5em 3em; box-shadow: 0 4px 32px #89CFF0; text-align: center; max-width: 400px; }
  .spinner { width: 48px; height: 48px; border: 5px solid #e0e7ff; border-top-color: #245ab1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.2em auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { color: #245ab1; margin: 0 0 0.5em 0; }
  p { color: #666; margin: 0; }
  .error { color: #d32f2f; font-weight: 700; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Se autentifică...</h2>
  <p id="msg">Te rugăm să aștepți.</p>
</div>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error || !code) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('title').textContent = 'Autentificare anulată';
    document.getElementById('msg').className = 'error';
    document.getElementById('msg').textContent = 'Ai anulat autentificarea cu Discord.';
    setTimeout(() => window.location.href = '/', 2000);
    return;
  }

  try {
    const res = await fetch('/api/discord-callback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();

    if (data.success && data.user) {
      sessionStorage.setItem('repartizareUser', JSON.stringify(data.user));
      document.getElementById('title').textContent = 'Autentificat!';
      document.getElementById('msg').textContent = 'Te redirecționăm...';
      window.location.href = '/?section=repartizare-zone';
    } else if (data.error === 'not_found') {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Cont negăsit';
      document.getElementById('msg').className = 'error';
      document.getElementById('msg').textContent = `Discord ID-ul tău (${data.discordId}) nu există în baza de date a departamentului.`;
      setTimeout(() => window.location.href = '/', 3000);
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch (err) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('title').textContent = 'Eroare';
    document.getElementById('msg').className = 'error';
    document.getElementById('msg').textContent = 'A apărut o eroare. Încearcă din nou.';
    setTimeout(() => window.location.href = '/', 3000);
  }
})();
</script>
</body>
</html>
